{% extends "base.html" %}
{% block title %}Brute Force{% endblock %}
{% block content %}
<div class="page-title">Distributed Brute Force</div>
<div class="grid-2">
    <div class="card">
        <div class="card-title">Control</div>
        <div style="margin-bottom:15px;">
            <label style="display:block; font-size:13px; color:#8b949e; margin-bottom:4px;">Target</label>
            <input type="text" id="bfTarget" placeholder="username">
        </div>
        <div style="margin-bottom:15px;">
            <label style="display:block; font-size:13px; color:#8b949e; margin-bottom:4px;">Wordlist (one per line)</label>
            <textarea id="bfWordlist" rows="5" style="font-family:monospace;">password123
admin
123456
qwerty</textarea>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" onclick="startBF()">Start</button>
            <button class="btn btn-danger" onclick="stopBF()">Stop</button>
        </div>
        <div id="bfStatus" style="margin-top:12px; font-size:14px; color:#8b949e;">Status: Idle</div>
    </div>
    <div class="card">
        <div class="card-title">Statistics</div>
        <div class="grid-4" style="gap:10px;">
            <div class="stat-box"><div class="num blue" id="bfTotal">0</div><div class="label">Total</div></div>
            <div class="stat-box"><div class="num white" id="bfPending">0</div><div class="label">Pending</div></div>
            <div class="stat-box"><div class="num green" id="bfSuccess">0</div><div class="label">Success</div></div>
            <div class="stat-box"><div class="num red" id="bfFail">0</div><div class="label">Failed</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="bfProgress" style="width:0%;"></div></div>
    </div>
</div>
<script>
    let bfInterval = null;
    async function startBF() {
        const target = document.getElementById('bfTarget').value.trim();
        const wordlist = document.getElementById('bfWordlist').value;
        if (!target || !wordlist) { alert('Enter target and wordlist.'); return; }
        const r = await fetch('/bruteforce/start', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({target, wordlist}) });
        const data = await r.json();
        if (data.status === 'started') {
            document.getElementById('bfStatus').innerText = 'Status: Running...';
            if (bfInterval) clearInterval(bfInterval);
            bfInterval = setInterval(fetchStatus, 2000);
            fetchStatus();
        }
    }
    async function stopBF() {
        await fetch('/bruteforce/stop', { method:'POST' });
        document.getElementById('bfStatus').innerText = 'Status: Stopped';
        if (bfInterval) clearInterval(bfInterval);
    }
    async function fetchStatus() {
        try {
            const r = await fetch('/bruteforce/status');
            const data = await r.json();
            document.getElementById('bfTotal').innerText = data.total || 0;
            document.getElementById('bfPending').innerText = data.queue_length || 0;
            document.getElementById('bfSuccess').innerText = data.success || 0;
            document.getElementById('bfFail').innerText = data.failed || 0;
            const pct = data.total > 0 ? Math.round((data.processed/data.total)*100) : 0;
            document.getElementById('bfProgress').style.width = Math.min(pct,100)+'%';
            if (!data.active && data.processed > 0) { document.getElementById('bfStatus').innerText = 'Status: Finished'; if(bfInterval) clearInterval(bfInterval); }
        } catch(e) {}
    }
    fetchStatus();
    setInterval(fetchStatus, 3000);
</script>
{% endblock %}
