<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>C2 Dashboard</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; border: 1px solid #00ff00; padding: 20px; }
        h1 { border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
        .logout { float: right; color: #ff4444; text-decoration: none; border: 1px solid #ff4444; padding: 5px 15px; }
        .logout:hover { background: #ff4444; color: #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #00ff00; padding: 10px; text-align: left; }
        th { background: #001a00; }
        .online { color: #00ff00; }
        .btn { background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 5px 15px; text-decoration: none; display: inline-block; }
        .btn:hover { background: #00ff00; color: #000; }
        .empty { text-align: center; padding: 30px; color: #005500; }
        .badge { display: inline-block; width: 10px; height: 10px; background: #00ff00; border-radius: 50%; animation: pulse 1.5s infinite; margin-right: 10px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
<div class="container">
    <h1>ROOT C2 :: CONTROL <a href="/logout" class="logout">[LOGOUT]</a></h1>
    <div><span class="badge"></span> LIVE | AUTO-REFRESH: 3s | BOTS: <span id="botCount">0</span></div>
    <table>
        <thead><tr><th>ID</th><th>IP</th><th>OS</th><th>LAST SEEN</th><th>ACTION</th></tr></thead>
        <tbody id="botsTable"><tr><td colspan="5" class="empty">WAITING FOR CONNECTIONS...</td></tr></tbody>
    </table>
</div>
<script>
    async function fetchBots() {
        try {
            const res = await fetch('/api/active_bots');
            const bots = await res.json();
            document.getElementById('botCount').innerText = bots.length;
            const table = document.getElementById('botsTable');
            if (bots.length === 0) { table.innerHTML = '<tr><td colspan="5" class="empty">NO ACTIVE SESSIONS</td></tr>'; return; }
            table.innerHTML = bots.map(b => `
                <tr>
                    <td><span class="online">[+]</span> ${b.id}</td>
                    <td>${b.ip}</td>
                    <td>${b.os}</td>
                    <td>${b.last_seen}</td>
                    <td><a href="/room/${b.id}" class="btn">CONNECT</a></td>
                </tr>
            `).join('');
        } catch(e) { console.error(e); }
    }
    setInterval(fetchBots, 3000);
    fetchBots();
</script>
</body>
</html>
