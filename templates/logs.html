{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<div class="page-title">Attack Logs</div>
<div style="background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:20px; max-height:500px; overflow-y:auto;">
    <div id="logContainer" style="font-family:monospace; font-size:13px; color:#2d3748;">
        <div style="color:#a0aec0;">No logs yet.</div>
    </div>
</div>
<script>
    async function fetchLogs() {
        try {
            const r = await fetch('/bruteforce/status');
            const data = await r.json();
            const container = document.getElementById('logContainer');
            if (!data.results || !data.results.length) { container.innerHTML = '<div style="color:#a0aec0;">No logs yet.</div>'; return; }
            container.innerHTML = data.results.slice().reverse().map(l => 
                `<div style="padding:6px 0; border-bottom:1px solid #edf2f7; display:flex; gap:15px;">
                    <span style="color:#a0aec0;">${l.time}</span>
                    <span style="font-weight:500;">${l.bot_id}</span>
                    <span style="color:#4a5568;">${l.password}</span>
                    <span style="color:${l.success ? '#38a169' : '#e53e3e'};">${l.success ? '✅ SUCCESS' : '❌ FAIL'}</span>
                    <span style="color:#718096;">${l.message}</span>
                </div>`
            ).join('');
        } catch(e) {}
    }
    setInterval(fetchLogs, 3000);
    fetchLogs();
</script>
{% endblock %}
