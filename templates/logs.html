{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<div class="page-title">Attack Logs</div>
<div class="card" style="max-height:500px; overflow-y:auto;">
    <div id="logContainer" style="font-family:monospace; font-size:13px; color:#c9d1d9;">
        <div style="color:#8b949e;">No logs yet.</div>
    </div>
</div>
<script>
    async function fetchLogs() {
        try {
            const r = await fetch('/bruteforce/status');
            const data = await r.json();
            const container = document.getElementById('logContainer');
            if (!data.results || !data.results.length) { container.innerHTML = '<div style="color:#8b949e;">No logs yet.</div>'; return; }
            container.innerHTML = data.results.slice().reverse().map(l => 
                `<div style="padding:6px 0; border-bottom:1px solid #21262d; display:flex; gap:15px; flex-wrap:wrap;">
                    <span style="color:#8b949e;">${l.time}</span>
                    <span style="color:#f0f6fc; font-weight:500;">${l.bot_id}</span>
                    <span>${l.password}</span>
                    <span style="color:${l.success ? '#3fb950' : '#f85149'};">${l.success ? '✅ SUCCESS' : '❌ FAIL'}</span>
                    <span style="color:#8b949e;">${l.message}</span>
                </div>`
            ).join('');
        } catch(e) {}
    }
    setInterval(fetchLogs, 3000);
    fetchLogs();
</script>
{% endblock %}
