<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>C2 Secure Login</title>
    <style>
        body { background: #0a0a0a; font-family: 'Courier New', monospace; color: #00ff00; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #111; padding: 40px; border: 2px solid #00ff00; border-radius: 8px; width: 350px; }
        .login-box h1 { text-align: center; color: #00ff00; font-weight: normal; border-bottom: 1px solid #00ff00; padding-bottom: 15px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #00ff00; color: #00ff00; font-family: monospace; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; background: #00ff00; color: #000; border: none; font-weight: bold; cursor: pointer; font-family: monospace; font-size: 16px; }
        .login-box button:hover { background: #00cc00; }
        .error { color: #ff3333; text-align: center; margin-top: 10px; background: #330000; padding: 8px; border: 1px solid #ff3333; }
    </style>
</head>
<body>
<div class="login-box">
    <h1>⚡ C2 SECURE</h1>
    <form method="post">
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">ACCESS</button>
    </form>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
</div>
</body>
</html>
