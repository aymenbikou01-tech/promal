<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>C2 Login</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            border: 2px solid #0f0;
            padding: 40px;
            background: #111;
            width: 300px;
            text-align: center;
        }
        input {
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px;
            width: 100%;
            margin: 10px 0;
            font-family: monospace;
        }
        button {
            background: #0f0;
            border: none;
            color: #000;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            color: #f00;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>⚡ C2 ACCESS</h2>
        <form method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
