<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 35px;
            width: 380px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.06);
            border: 1px solid #edf2f7;
        }
        .login-card h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .login-card .sub {
            color: #718096;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-card .input-group {
            margin-bottom: 16px;
        }
        .login-card .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 5px;
        }
        .login-card .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #fafbfc;
        }
        .login-card .input-group input:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74,108,247,0.08);
            background: #fff;
        }
        .login-card .btn {
            width: 100%;
            padding: 12px;
            background: #4a6cf7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-card .btn:hover { background: #3b5de7; }
        .login-card .error {
            color: #e53e3e;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            background: #fff5f5;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #fed7d7;
        }
        .login-card .footer { margin-top: 20px; font-size: 12px; color: #a0aec0; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Welcome</h1>
        <p class="sub">Sign in to access your dashboard</p>
        <form method="post">
            <div class="input-group">
                <label>Email</label>
                <input type="text" name="email" placeholder="Enter your email" required autofocus>
            </div>
            <div class="input-group">
                <label>Key</label>
                <input type="password" name="key" placeholder="Enter your key" required>
            </div>
            <div class="input-group">
                <label>PIN</label>
                <input type="password" name="pin" placeholder="Enter your PIN" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
        </form>
        <div class="footer">Secured by CloudCore</div>
    </div>
</body>
</html>
