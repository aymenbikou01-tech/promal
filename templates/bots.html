{% extends "base.html" %}
{% block title %}Nodes{% endblock %}
{% block content %}
<div class="page-title">Connected Nodes</div>
<div style="background:#fff; border:1px solid #e2e8f0; border-radius:10px; overflow:hidden;">
    <table style="width:100%; border-collapse:collapse; font-size:14px;">
        <thead>
            <tr style="background:#f7fafc; border-bottom:1px solid #e2e8f0;">
                <th style="padding:12px 16px; text-align:left; color:#4a5568;">ID</th>
                <th style="padding:12px 16px; text-align:left; color:#4a5568;">IP</th>
                <th style="padding:12px 16px; text-align:left; color:#4a5568;">OS</th>
                <th style="padding:12px 16px; text-align:left; color:#4a5568;">Status</th>
                <th style="padding:12px 16px; text-align:left; color:#4a5568;">Last Seen</th>
            </tr>
        </thead>
        <tbody id="botsTable">
            <tr><td colspan="5" style="padding:30px; text-align:center; color:#a0aec0;">No nodes connected</td></tr>
        </tbody>
    </table>
</div>
<script>
    async function fetchBots() {
        try {
            const r = await fetch('/api/active_bots');
            const bots = await r.json();
            const tbody = document.getElementById('botsTable');
            if (!bots.length) { tbody.innerHTML = '<tr><td colspan="5" style="padding:30px;text-align:center;color:#a0aec0;">No nodes connected</td></tr>'; return; }
            tbody.innerHTML = bots.map(b => `<tr style="border-bottom:1px solid #edf2f7;">
                <td style="padding:12px 16px; font-weight:500;">${b.id}</td>
                <td style="padding:12px 16px;">${b.ip}</td>
                <td style="padding:12px 16px;">${b.os}</td>
                <td style="padding:12px 16px;"><span style="color:${b.online ? '#38a169' : '#a0aec0'};">${b.online ? '● Online' : '○ Offline'}</span></td>
                <td style="padding:12px 16px;">${b.last_seen}</td>
            </tr>`).join('');
        } catch(e) {}
    }
    setInterval(fetchBots, 3000);
    fetchBots();
</script>
{% endblock %}
