{% extends "base.html" %}
{% block title %}Nodes{% endblock %}
{% block content %}
<div class="page-title">Connected Nodes</div>
<div class="card" style="padding:0; overflow:hidden;">
    <table>
        <thead>
            <tr>
                <th>ID</th><th>IP</th><th>OS</th><th>Status</th><th>Last Seen</th>
            </tr>
        </thead>
        <tbody id="botsTable">
            <tr><td colspan="5" style="padding:30px;text-align:center;color:#8b949e;">No nodes connected</td></tr>
        </tbody>
    </table>
</div>
<script>
    async function fetchBots() {
        try {
            const r = await fetch('/api/active_bots');
            const bots = await r.json();
            const tbody = document.getElementById('botsTable');
            if (!bots.length) { tbody.innerHTML = '<tr><td colspan="5" style="padding:30px;text-align:center;color:#8b949e;">No nodes connected</td></tr>'; return; }
            tbody.innerHTML = bots.map(b => `<tr>
                <td style="font-weight:500;">${b.id}</td>
                <td>${b.ip}</td>
                <td>${b.os}</td>
                <td><span style="color:${b.online ? '#3fb950' : '#8b949e'};">${b.online ? '● Online' : '○ Offline'}</span></td>
                <td>${b.last_seen}</td>
            </tr>`).join('');
        } catch(e) {}
    }
    setInterval(fetchBots, 3000);
    fetchBots();
</script>
{% endblock %}
